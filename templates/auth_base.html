<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Entrar{% endblock %} · Meu Sistema</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dist/css/adminlte.min.css') }}">
  <style>
    body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #10242b; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
    .auth-card { width: 100%; max-width: 400px; background: #fff; border-radius: 14px; padding: 2rem; }
    .auth-brand { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.25rem; color: #10242b; margin-bottom: 1.5rem; }
    .auth-brand i { color: #0f766e; font-size: 1.6rem; }
    .btn-teal { background: #0f766e; color: #fff; font-weight: 600; }
    .btn-teal:hover, .btn-teal:focus-visible { background: #0b5d57; color: #fff; }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-brand"><i class="bi bi-cup-straw"></i> Meu Sistema</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
